name: erp-execution-cloud

on:
  schedule:
    # 09:13 Asia/Shanghai on the 13th and 28th of every month.
    - cron: "13 1 13 * *"
    - cron: "13 1 28 * *"
  workflow_dispatch:
    inputs:
      push_summary:
        description: "Push ERP execution summary to Feishu webhook after generation"
        required: false
        default: true
        type: boolean
      merged_signal_url:
        description: "Merged signal JSON URL produced by erp-relative-master-scheduler"
        required: false
        default: "https://keycool.github.io/index-compare-analysis/data/merged_signal.json"
        type: string
      execution_mode:
        description: "rebalance blocks stale holdings; research keeps stale holdings as warnings"
        required: false
        default: "research"
        type: choice
        options:
          - research
          - rebalance
      as_of:
        description: "Optional unified signal cutoff date (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      portfolio_snapshot_as_of:
        description: "Optional portfolio snapshot date for strict holdings freshness checks (YYYY-MM-DD)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: erp-execution-cloud
  cancel-in-progress: false

jobs:
  run-erp-execution-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ERP execution regression tests
        run: python -m unittest tests.test_erp_execution_cloud_logic

      - name: Resolve push mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ERP_EXECUTION_PUSH_SUMMARY=true" >> "$GITHUB_ENV"
          elif [ "${{ inputs.push_summary }}" = "true" ]; then
            echo "ERP_EXECUTION_PUSH_SUMMARY=true" >> "$GITHUB_ENV"
          else
            echo "ERP_EXECUTION_PUSH_SUMMARY=false" >> "$GITHUB_ENV"
          fi

      - name: Download latest merged signal
        env:
          ERP_MERGED_SIGNAL_URL: ${{ inputs.merged_signal_url || 'https://keycool.github.io/index-compare-analysis/data/merged_signal.json' }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          url = os.environ["ERP_MERGED_SIGNAL_URL"].strip()
          summary_lines = ["## ERP execution signal source", ""]
          event_name = "${{ github.event_name }}"
          push_summary = os.environ.get("ERP_EXECUTION_PUSH_SUMMARY") == "true"
          strict_signal_gate = event_name == "schedule" or push_summary
          if not url:
              raise SystemExit("ERP_MERGED_SIGNAL_URL is required; refusing unverified Feishu fallback for pushed ERP summaries")

          def tushare_call(api_name: str, params: dict, fields: str) -> dict:
              token = os.environ.get("TUSHARE_TOKEN", "").strip()
              if not token:
                  raise SystemExit("TUSHARE_TOKEN is required for ERP previous-trading-day gate")
              req_body = json.dumps({
                  "api_name": api_name,
                  "token": token,
                  "params": params,
                  "fields": fields,
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.tushare.pro",
                  data=req_body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if payload.get("code") not in (0, None):
                  raise RuntimeError(f"Tushare {api_name} failed: {payload}")
              return payload

          shanghai_today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          required_signal_date = None
          if strict_signal_gate:
              today = shanghai_today.strftime("%Y%m%d")
              start_date = (datetime.now(ZoneInfo("Asia/Shanghai")) - timedelta(days=45)).strftime("%Y%m%d")
              cal_payload = tushare_call(
                  "trade_cal",
                  {"exchange": "SSE", "start_date": start_date, "end_date": today},
                  "cal_date,is_open",
              )
              trade_dates = [
                  str(item[0])
                  for item in (((cal_payload or {}).get("data") or {}).get("items") or [])
                  if str(item[1]) == "1" and str(item[0]) < today
              ]
              if not trade_dates:
                  raise SystemExit("Unable to determine previous SSE trading day")
              required_signal_raw = max(trade_dates)
              required_signal_date = datetime.strptime(required_signal_raw, "%Y%m%d").date()

          def parse_signal_date(value, label: str):
              raw = str(value or "").strip()
              if not raw:
                  raise ValueError(f"{label} is missing")
              candidate = raw[:10]
              try:
                  if len(candidate) >= 10 and candidate[4] == "-" and candidate[7] == "-":
                      parsed = datetime.strptime(candidate, "%Y-%m-%d").date()
                  elif len(raw) >= 8 and raw[:8].isdigit():
                      parsed = datetime.strptime(raw[:8], "%Y%m%d").date()
                  else:
                      raise ValueError
              except ValueError as exc:
                  raise ValueError(f"{label} {raw!r} is not a valid date") from exc
              if parsed > shanghai_today:
                  raise ValueError(f"{label} {parsed.isoformat()} is after today {shanghai_today.isoformat()}")
              return parsed

          def max_record_date(records: list[dict], label: str):
              dates = []
              for record in records:
                  for key in ("date", "日期", "trade_date"):
                      if record.get(key):
                          dates.append(parse_signal_date(record.get(key), f"{label} record {key}"))
                          break
              if not dates:
                  raise ValueError(f"{label} records do not contain parseable dates")
              return max(dates)

          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))

              components = payload.get("components") or {}
              erp = components.get("erp") or {}
              relative = components.get("relative") or {}
              if not erp.get("records"):
                  raise ValueError("Merged signal missing ERP records")
              if not relative.get("records"):
                  raise ValueError("Merged signal missing relative records")
              erp_latest = parse_signal_date(erp.get("latest_date"), "ERP latest_date")
              relative_latest = parse_signal_date(relative.get("latest_date"), "Relative latest_date")
              erp_record_max = max_record_date(erp.get("records", []), "ERP")
              relative_record_max = max_record_date(relative.get("records", []), "Relative")
              if erp_latest != erp_record_max:
                  raise ValueError(f"ERP latest_date {erp_latest.isoformat()} does not match record max date {erp_record_max.isoformat()}")
              if relative_latest != relative_record_max:
                  raise ValueError(f"Relative latest_date {relative_latest.isoformat()} does not match record max date {relative_record_max.isoformat()}")
              if strict_signal_gate and required_signal_date is not None:
                  erp_age_days = (required_signal_date - erp_record_max).days
                  if erp_age_days < 0:
                      raise ValueError(f"ERP record max date {erp_record_max.isoformat()} is after required previous trading day {required_signal_date.isoformat()}")
                  if erp_age_days > 14:
                      raise ValueError(f"ERP record max date {erp_record_max.isoformat()} is stale: {erp_age_days} days > 14")
                  if relative_record_max != required_signal_date:
                      raise ValueError(f"Relative record max date {relative_record_max.isoformat()} must equal required previous trading day {required_signal_date.isoformat()}")

              temp_dir = Path(os.environ["RUNNER_TEMP"])
              erp_path = temp_dir / "erp_signal.json"
              relative_path = temp_dir / "relative_signal.json"
              erp_path.write_text(json.dumps(erp, ensure_ascii=False, indent=2), encoding="utf-8")
              relative_path.write_text(json.dumps(relative, ensure_ascii=False, indent=2), encoding="utf-8")

              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
                  env_file.write(f"ERP_EXEC_ERP_SIGNAL_JSON={erp_path}\n")
                  env_file.write(f"ERP_EXEC_RELATIVE_SIGNAL_JSON={relative_path}\n")

              summary_lines.extend([
                  f"- Merged signal URL: `{url}`",
                  "- Source: `merged_signal.json`",
                  f"- Strict signal gate: `{'true' if strict_signal_gate else 'false'}`",
                  f"- Required previous trading day: `{required_signal_date.isoformat() if required_signal_date else 'not enforced'}`",
                  f"- ERP latest date: `{erp_latest.isoformat()}`",
                  f"- ERP record max date: `{erp_record_max.isoformat()}`",
                  f"- Relative latest date: `{relative_latest.isoformat()}`",
                  f"- Relative record max date: `{relative_record_max.isoformat()}`",
                  f"- ERP records: `{len(erp.get('records', []))}`",
                  f"- Relative records: `{len(relative.get('records', []))}`",
              ])
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, ValueError) as exc:
              raise SystemExit(f"Merged signal failed ERP previous-trading-day gate; refusing to push ERP draft: {exc}")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(summary_lines) + "\n")
          PY

      - name: Run ERP execution workflow
        run: |
          if [ "$ERP_EXECUTION_PUSH_SUMMARY" = "true" ]; then
            python orchestrator/run_erp_execution_cloud.py --execution-mode "$ERP_EXECUTION_MODE" --as-of "$ERP_EXECUTION_AS_OF" --portfolio-snapshot-as-of "$ERP_PORTFOLIO_SNAPSHOT_AS_OF" --push-summary
          else
            python orchestrator/run_erp_execution_cloud.py --execution-mode "$ERP_EXECUTION_MODE" --as-of "$ERP_EXECUTION_AS_OF" --portfolio-snapshot-as-of "$ERP_PORTFOLIO_SNAPSHOT_AS_OF"
          fi
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          ERP_EXEC_ERP_APP_TOKEN: ${{ secrets.ERP_EXEC_ERP_APP_TOKEN || secrets.ERP_FEISHU_APP_TOKEN || secrets.FEISHU_APP_TOKEN }}
          ERP_EXEC_ERP_TABLE_ID: ${{ secrets.ERP_EXEC_ERP_TABLE_ID || secrets.ERP_FEISHU_TABLE_ID || secrets.FEISHU_TABLE_ID }}
          ERP_EXEC_RELATIVE_APP_TOKEN: ${{ secrets.ERP_EXEC_RELATIVE_APP_TOKEN || secrets.CSI_FEISHU_APP_TOKEN || secrets.FEISHU_APP_TOKEN }}
          ERP_EXEC_RELATIVE_TABLE_ID: ${{ secrets.ERP_EXEC_RELATIVE_TABLE_ID || secrets.CSI_FEISHU_TABLE_ID || secrets.FEISHU_TABLE_ID }}
          ERP_EXEC_ASSET_APP_TOKEN: ${{ secrets.ERP_EXEC_ASSET_APP_TOKEN }}
          ERP_EXEC_ASSET_TABLE_ID: ${{ secrets.ERP_EXEC_ASSET_TABLE_ID }}
          ERP_DAILY_FEISHU_WEBHOOK_URL: ${{ secrets.ERP_DAILY_FEISHU_WEBHOOK_URL }}
          ERP_DAILY_FEISHU_WEBHOOK_SECRET: ${{ secrets.ERP_DAILY_FEISHU_WEBHOOK_SECRET }}
          ERP_EXECUTION_PUSH_SUMMARY: ${{ env.ERP_EXECUTION_PUSH_SUMMARY }}
          ERP_EXECUTION_MODE: ${{ inputs.execution_mode || 'research' }}
          ERP_EXECUTION_AS_OF: ${{ inputs.as_of || '' }}
          ERP_PORTFOLIO_SNAPSHOT_AS_OF: ${{ inputs.portfolio_snapshot_as_of || '' }}

      - name: Validate ERP execution artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan_path = Path("orchestrator/output/erp_execution_plan.json")
          summary_path = Path("orchestrator/output/erp_daily_summary.md")
          if not plan_path.exists():
              raise SystemExit("Missing ERP execution plan artifact")
          if not summary_path.exists():
              raise SystemExit("Missing ERP daily summary artifact")

          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          portfolio = plan.get("portfolio", {})
          positions = plan.get("portfolio", {}).get("positions", [])
          total_weight = sum(float(item.get("target_weight", 0)) for item in positions)
          if abs(total_weight - 1.0) > 0.0015:
              raise SystemExit(f"Target weights must sum to 100%, got {total_weight:.4%}")

          health = plan.get("signals", {}).get("data_health", {})
          if health.get("errors"):
              raise SystemExit("Data health check failed: " + "; ".join(health["errors"]))

          defensive_value = next((item for item in positions if item.get("bucket") == "sh50"), None)
          if defensive_value is None:
              raise SystemExit("Missing defensive value bucket sh50 in ERP execution plan")
          if defensive_value.get("label") not in ("防守价值（上证50）", "防守价值(上证50)"):
              raise SystemExit(f"Unexpected sh50 label: {defensive_value.get('label')}")

          breakdown = defensive_value.get("holding_breakdown", [])
          lines = [
              "## ERP execution validation",
              "",
              f"- Generated at: `{plan.get('generated_at', '-')}`",
              f"- As of: `{health.get('as_of', '-')}`",
              f"- Managed amount: `{portfolio.get('managed_amount', 0):,.2f}`",
              f"- Target weight sum: `{total_weight:.4%}`",
              f"- Data dates: `{health.get('dates', {})}`",
              f"- Defensive value current amount: `{defensive_value.get('current_amount', 0):,.2f}`",
              f"- Defensive value target amount: `{defensive_value.get('target_amount', 0):,.2f}`",
          ]
          if health.get("warnings"):
              lines.extend(["", "### Warnings"])
              lines.extend(f"- {item}" for item in health["warnings"])
          lines.extend(["", "### Defensive value holdings"])
          if breakdown:
              lines.extend(f"- `{item.get('name', '-')}`: `{item.get('amount', 0):,.2f}`" for item in breakdown)
          else:
              lines.append("- No current holdings mapped to this bucket.")

          summary_file = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          summary_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload ERP execution artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: erp-execution-cloud-${{ github.run_id }}
          path: |
            orchestrator/output/erp_execution_plan.json
            orchestrator/output/erp_daily_summary.md
          if-no-files-found: warn
          retention-days: 30
