name: erp-relative-master-scheduler

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/erp-relative-master-scheduler.yml"
      - ".claude/skills/index-compare/**"
      - "vercel.json"
  schedule:
    # GitHub cron uses UTC:
    # 15:18 UTC = 23:18 Asia/Shanghai, Monday-Friday.
    - cron: "18 15 * * 1-5"
  workflow_dispatch:
    inputs:
      force_relative:
        description: "Force Relative full update (true/false)"
        required: false
        default: "false"
        type: string
      erp_start_date:
        description: "ERP backfill start date (YYYYMMDD or YYYY-MM-DD)"
        required: false
        default: "2026-02-14"
        type: string
      erp_end_date:
        description: "Optional ERP end date (YYYYMMDD or YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      restore_site_on_skip:
        description: "Manual run only: rebuild and deploy the existing committed site data when preflight skips (true/false)"
        required: false
        default: "true"
        type: string
permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: erp-relative-master-scheduler
  cancel-in-progress: false

jobs:
  run-master-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      should_run: ${{ steps.preflight.outputs.should_run }}
      restore_site: ${{ steps.preflight.outputs.restore_site }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight Tushare freshness check
        id: preflight
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          LATEST_SIGNAL_URL: https://keycool.github.io/index-compare-analysis/data/merged_signal.json
          MIN_ALL_A_DAILY_ROWS: "5000"
          REQUIRED_INDEX_DAILY_CODES: "000300.SH,000905.SH,000852.SH,399006.SZ,000016.SH,000688.SH,000919.CSI,000918.CSI"
          REQUIRED_GLOBAL_INDEX_CODES: "HSI,HKTECH"
          PREFLIGHT_RETRY_ATTEMPTS: "3"
          PREFLIGHT_RETRY_SLEEP_SECONDS: "600"
          RESTORE_SITE_ON_SKIP: ${{ github.event.inputs.restore_site_on_skip || 'true' }}
          VERCEL_CANONICAL_URL: https://index-compare-analysis.vercel.app
        run: |
          python - << 'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          event_name = "${{ github.event_name }}"
          is_manual = event_name == "workflow_dispatch"
          restore_site_on_skip = os.environ.get("RESTORE_SITE_ON_SKIP", "true").strip().lower() == "true"
          output_path = os.environ["GITHUB_OUTPUT"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          shanghai_now = datetime.now(ZoneInfo("Asia/Shanghai"))
          shanghai_today = shanghai_now.strftime("%Y%m%d")
          shanghai_today_text = f"{shanghai_today[:4]}-{shanghai_today[4:6]}-{shanghai_today[6:8]}"
          preflight_window_start = (shanghai_now - timedelta(days=20)).strftime("%Y%m%d")
          min_all_a_rows = int(os.environ.get("MIN_ALL_A_DAILY_ROWS", "5000"))

          def write_output(key: str, value: str) -> None:
              with open(output_path, "a", encoding="utf-8") as f:
                  f.write(f"{key}={value}\n")

          def write_summary(lines: list[str]) -> None:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")

          write_output("restore_site", "false")

          if event_name == "push":
              write_output("should_run", "false")
              write_output("restore_site", "true")
              write_output("reason", "push_redeploy_committed_site")
              write_output("latest_trade_date", "not_checked")
              write_output("deployed_latest_date", "not_checked")
              write_summary([
                  "## Preflight check",
                  "",
                  f"- Event: `{event_name}`",
                  "- Decision: `restore_site`",
                  "- Reason: `push_redeploy_committed_site`",
                  "- Effect: formal calculation, Tushare refresh, web data update, and Feishu pushes are skipped; existing committed site data is redeployed.",
              ])
              raise SystemExit(0)

          token = os.environ.get("TUSHARE_TOKEN", "").strip()
          if not token:
              raise SystemExit("TUSHARE_TOKEN is required for Tushare preflight")

          latest_signal_url = os.environ.get("LATEST_SIGNAL_URL", "").strip()
          vercel_canonical_url = os.environ.get("VERCEL_CANONICAL_URL", "").strip()
          required_index_codes = [
              code.strip()
              for code in os.environ.get("REQUIRED_INDEX_DAILY_CODES", "").split(",")
              if code.strip()
          ]
          required_global_codes = [
              code.strip()
              for code in os.environ.get("REQUIRED_GLOBAL_INDEX_CODES", "").split(",")
              if code.strip()
          ]
          retry_attempts = int(os.environ.get("PREFLIGHT_RETRY_ATTEMPTS", "3"))
          retry_sleep_seconds = int(os.environ.get("PREFLIGHT_RETRY_SLEEP_SECONDS", "600"))

          def tushare_call(api_name: str, params: dict, fields: str) -> dict:
              req_body = json.dumps({
                  "api_name": api_name,
                  "token": token,
                  "params": params,
                  "fields": fields,
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.tushare.pro",
                  data=req_body,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=45) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))
              if payload.get("code") not in (0, None):
                  raise RuntimeError(f"Tushare {api_name} failed: {payload}")
              return payload

          def fetch_deployed_latest_date() -> tuple[str, str]:
              if not latest_signal_url:
                  return "", ""
              try:
                  with urllib.request.urlopen(latest_signal_url, timeout=30) as resp:
                      merged_payload = json.loads(resp.read().decode("utf-8"))
                  components = (merged_payload or {}).get("components") or {}
                  relative_component = components.get("relative") if isinstance(components, dict) else {}
                  return str(
                      (relative_component or {}).get("latest_date")
                      or (merged_payload or {}).get("latest_date")
                      or ""
                  ), ""
              except urllib.error.URLError as exc:
                  return "", str(exc)
              except Exception as exc:
                  return "", str(exc)

          def fetch_http_status(url: str) -> tuple[str, str]:
              if not url:
                  return "", ""
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "erp-relative-preflight"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return str(resp.status), ""
              except urllib.error.HTTPError as exc:
                  return str(exc.code), str(exc)
              except urllib.error.URLError as exc:
                  return "", str(exc)
              except Exception as exc:
                  return "", str(exc)

          def check_tushare_ready(trade_date: str) -> dict:
              missing_index_codes = []
              for ts_code in required_index_codes:
                  index_payload = tushare_call(
                      "index_daily",
                      {"ts_code": ts_code, "trade_date": trade_date},
                      "ts_code,trade_date",
                  )
                  index_items = (((index_payload or {}).get("data") or {}).get("items")) or []
                  if not index_items:
                      missing_index_codes.append(ts_code)

              missing_global_codes = []
              for ts_code in required_global_codes:
                  global_payload = tushare_call(
                      "index_global",
                      {"ts_code": ts_code, "start_date": trade_date, "end_date": trade_date},
                      "ts_code,trade_date",
                  )
                  global_items = (((global_payload or {}).get("data") or {}).get("items")) or []
                  if not global_items:
                      missing_global_codes.append(ts_code)

              all_a_payload = tushare_call(
                  "daily",
                  {"trade_date": trade_date},
                  "ts_code,trade_date",
              )
              all_a_items = (((all_a_payload or {}).get("data") or {}).get("items")) or []
              all_a_daily_rows = len(all_a_items)
              data_ready = (
                  not missing_index_codes
                  and not missing_global_codes
                  and all_a_daily_rows >= min_all_a_rows
              )
              return {
                  "data_ready": data_ready,
                  "missing_index_codes": missing_index_codes,
                  "missing_global_codes": missing_global_codes,
                  "all_a_daily_rows": all_a_daily_rows,
              }

          calendar_payload = tushare_call(
              "trade_cal",
              {
                  "exchange": "SSE",
                  "start_date": preflight_window_start if is_manual else shanghai_today,
                  "end_date": shanghai_today,
              },
              "cal_date,is_open",
          )
          calendar_items = (((calendar_payload or {}).get("data") or {}).get("items")) or []
          open_dates = sorted(
              str(item[0])
              for item in calendar_items
              if len(item) > 1 and str(item[1]) == "1"
          )
          is_sse_trading_day = shanghai_today in open_dates

          if not is_sse_trading_day and not is_manual:
              write_output("should_run", "false")
              write_output("reason", "not_sse_trading_day")
              write_output("latest_trade_date", "none")
              write_output("deployed_latest_date", "not_checked")
              write_summary([
                  "## Preflight check",
                  "",
                  f"- Event: `{event_name}`",
                  f"- Shanghai date: `{shanghai_today_text}`",
                  "- SSE trading day: `false`",
                  "- Decision: `skip`",
                  "- Reason: `not_sse_trading_day`",
                  "- Effect: formal calculation, web data update, and Vercel deploy are skipped.",
              ])
              raise SystemExit(0)

          target_trade_date = shanghai_today
          if is_manual:
              latest_index_payload = tushare_call(
                  "index_daily",
                  {
                      "ts_code": "000300.SH",
                      "start_date": preflight_window_start,
                      "end_date": shanghai_today,
                  },
                  "trade_date",
              )
              latest_index_items = (((latest_index_payload or {}).get("data") or {}).get("items")) or []
              latest_index_dates = sorted({str(item[0]) for item in latest_index_items if item})
              if latest_index_dates:
                  target_trade_date = latest_index_dates[-1]
              elif open_dates:
                  target_trade_date = open_dates[-1]
              else:
                  write_output("should_run", "false")
                  write_output("reason", "no_recent_trading_day")
                  write_output("latest_trade_date", "none")
                  write_output("deployed_latest_date", "not_checked")
                  write_summary([
                      "## Preflight check",
                      "",
                      f"- Event: `{event_name}`",
                      f"- Shanghai date: `{shanghai_today_text}`",
                      "- Decision: `skip`",
                      "- Reason: `no_recent_trading_day`",
                      "- Effect: formal calculation, web data update, and Vercel deploy are skipped.",
                  ])
                  raise SystemExit(0)
          target_trade_date_text = (
              f"{target_trade_date[:4]}-{target_trade_date[4:6]}-{target_trade_date[6:8]}"
          )

          latest_trade_date_raw = target_trade_date
          latest_trade_date = f"{latest_trade_date_raw[:4]}-{latest_trade_date_raw[4:6]}-{latest_trade_date_raw[6:8]}"

          attempts = 1 if is_manual else max(1, retry_attempts)
          readiness = None
          deployed_latest_date = ""
          fetch_error = ""
          should_run = True
          reason = "new_data_detected"
          restore_site = False
          vercel_status = ""
          vercel_error = ""

          for attempt in range(1, attempts + 1):
              deployed_latest_date, fetch_error = fetch_deployed_latest_date()
              if not is_manual and deployed_latest_date and deployed_latest_date >= latest_trade_date:
                  vercel_status, vercel_error = fetch_http_status(vercel_canonical_url)
                  should_run = False
                  if vercel_status == "200":
                      reason = "no_new_tushare_data"
                  else:
                      restore_site = True
                      reason = f"vercel_unhealthy_{vercel_status or 'unknown'}_restore_site"
                  readiness = {
                      "data_ready": True,
                      "missing_index_codes": [],
                      "missing_global_codes": [],
                      "all_a_daily_rows": "not_checked",
                  }
                  break

              readiness = check_tushare_ready(target_trade_date)
              if readiness["data_ready"]:
                  break

              if attempt < attempts:
                  print(
                      f"Preflight data not ready for {latest_trade_date}; "
                      f"attempt {attempt}/{attempts}; retrying in {retry_sleep_seconds}s"
                  )
                  time.sleep(retry_sleep_seconds)

          if readiness is None:
              raise SystemExit("Preflight readiness check did not run")

          missing_index_codes = readiness["missing_index_codes"]
          missing_global_codes = readiness["missing_global_codes"]
          all_a_daily_rows = readiness["all_a_daily_rows"]
          data_ready = bool(readiness["data_ready"])
          if data_ready and should_run and fetch_error:
              reason = "latest_signal_unavailable_run_anyway"

          if not data_ready:
              missing_reasons = []
              if missing_index_codes:
                  missing_reasons.append("missing_index_daily:" + ",".join(missing_index_codes))
              if missing_global_codes:
                  missing_reasons.append("missing_index_global:" + ",".join(missing_global_codes))
              if all_a_daily_rows < min_all_a_rows:
                  missing_reasons.append(f"all_a_daily_rows_below_{min_all_a_rows}")
              reason = ",".join(missing_reasons)
              write_output("should_run", "false")
              if is_manual and restore_site_on_skip:
                  write_output("restore_site", "true")
              write_output("reason", reason)
              write_output("latest_trade_date", target_trade_date_text if not missing_index_codes else "none")
              write_output("deployed_latest_date", "not_checked")
              write_summary([
                  "## Preflight check",
                  "",
                  f"- Event: `{event_name}`",
                  f"- Shanghai date: `{shanghai_today_text}`",
                  f"- SSE trading day: `{'true' if is_sse_trading_day else 'false'}`",
                  f"- Target trade date: `{target_trade_date_text}`",
                  f"- Required index_daily codes: `{', '.join(required_index_codes)}`",
                  f"- Required index_global codes: `{', '.join(required_global_codes)}`",
                  f"- Missing index_daily codes: `{', '.join(missing_index_codes) or '-'}`",
                  f"- Missing index_global codes: `{', '.join(missing_global_codes) or '-'}`",
                  f"- All-A daily rows: `{all_a_daily_rows}`",
                  f"- All-A minimum rows: `{min_all_a_rows}`",
                  f"- Attempts: `{attempts}`",
                  f"- Decision: `{'restore_site' if is_manual and restore_site_on_skip else 'skip'}`",
                  f"- Reason: `{reason}`",
                  "- Effect: formal calculation and web data update are skipped; existing committed site data is redeployed."
                  if is_manual and restore_site_on_skip
                  else "- Effect: formal calculation, web data update, and Vercel deploy are skipped.",
              ])
              raise SystemExit(0)

          if is_manual:
              should_run = True
              reason = "manual_redeploy_existing_data"

          write_output("should_run", "true" if should_run else "false")
          write_output("restore_site", "true" if restore_site else "false")
          write_output("reason", reason)
          write_output("latest_trade_date", latest_trade_date)
          write_output("deployed_latest_date", deployed_latest_date or "unknown")

          lines = [
              "## Preflight check",
              "",
              f"- Event: `{event_name}`",
              f"- Shanghai date: `{shanghai_today_text}`",
              f"- SSE trading day: `{'true' if is_sse_trading_day else 'false'}`",
              f"- Target trade date: `{target_trade_date_text}`",
              f"- Required index_daily codes: `{', '.join(required_index_codes)}`",
              f"- Required index_global codes: `{', '.join(required_global_codes)}`",
              "- Missing index_daily codes: `-`",
              "- Missing index_global codes: `-`",
              f"- All-A daily rows: `{all_a_daily_rows}`",
              f"- All-A minimum rows: `{min_all_a_rows}`",
              f"- Attempts: `{attempt}`",
              f"- Tushare latest trade date: `{latest_trade_date}`",
              f"- Deployed relative latest date: `{deployed_latest_date or 'unknown'}`",
              f"- Vercel canonical status: `{vercel_status or 'not_checked'}`",
              f"- Decision: `{'run' if should_run else 'skip'}`",
              f"- Reason: `{reason}`",
          ]
          if restore_site:
              lines[-2] = "- Decision: `restore_site`"
              lines.append("- Effect: formal calculation and web data update are skipped; existing committed site data is redeployed to recover the site.")
          if vercel_error:
              lines.append(f"- Vercel note: `{vercel_error}`")
          if fetch_error:
              lines.append(f"- Note: failed to fetch latest deployed signal, so workflow continues. `{fetch_error}`")
          write_summary(lines)
          PY

      - name: Checkout CSI300 Relative Index
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          path: csi300-relative-index

      - name: Checkout CSI300 Relative Index for site restore
        if: steps.preflight.outputs.restore_site == 'true'
        uses: actions/checkout@v6
        with:
          path: csi300-relative-index

      - name: Checkout Equity Risk Premium
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.ERP_REPOSITORY || 'keycool/equity-risk-premium' }}
          token: ${{ secrets.CROSS_REPO_PAT || github.token }}
          path: external/equity-risk-premium

      - name: Setup Node
        if: steps.preflight.outputs.should_run == 'true' || steps.preflight.outputs.restore_site == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r csi300-relative-index/.claude/skills/index-compare/requirements.txt
          pip install -r external/equity-risk-premium/skills/equity-risk-premium/requirements.txt

      - name: Restore site from committed Relative data
        if: steps.preflight.outputs.restore_site == 'true'
        working-directory: csi300-relative-index
        env:
          PAGES_CANONICAL_URL: https://keycool.github.io/index-compare-analysis
        run: |
          set -euo pipefail

          mkdir -p reports ../shared

          RESTORE_SOURCE="generated_from_committed_data"
          if python -m pip install --upgrade pip \
            && pip install -r .claude/skills/index-compare/requirements.txt \
            && python .claude/skills/index-compare/scripts/generate_report.py \
              --output "$PWD/reports" \
              --mode production; then
            echo "[RESTORE] Generated report from committed data"
          else
            RESTORE_SOURCE="downloaded_from_github_pages"
            echo "::warning::Failed to generate report from committed data; falling back to current GitHub Pages HTML"
            FALLBACK_REPORT="reports/index_compare_$(date -u +%Y%m%d_%H%M%S).html"
            curl -fsSL "$PAGES_CANONICAL_URL/" -o "$FALLBACK_REPORT"
            test -s "$FALLBACK_REPORT"
            echo "[RESTORE] Downloaded fallback report to $FALLBACK_REPORT"
          fi
          export RESTORE_SOURCE

          python - << 'PY'
          import csv
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          data_path = Path(".claude/skills/index-compare/data/processed_data.csv")
          latest_date = ""
          if data_path.exists():
              with data_path.open("r", encoding="utf-8", newline="") as f:
                  rows = csv.reader(f)
                  next(rows, None)
                  for row in rows:
                      if row:
                          latest_date = str(row[0])[:10]

          pages_url = os.environ.get("PAGES_CANONICAL_URL", "").rstrip("/")
          shared_dir = Path("../shared")
          shared_dir.mkdir(parents=True, exist_ok=True)
          merged_path = shared_dir / "merged_signal.json"
          if pages_url:
              try:
                  subprocess.run(
                      ["curl", "-fsSL", f"{pages_url}/data/merged_signal.json", "-o", str(merged_path)],
                      check=True,
                      timeout=45,
                  )
                  print("[RESTORE] Downloaded merged_signal.json from GitHub Pages")
              except Exception as exc:
                  print(f"::warning::Failed to download published merged_signal.json: {exc}")

          if merged_path.exists() and merged_path.stat().st_size > 0:
              try:
                  payload = json.loads(merged_path.read_text(encoding="utf-8"))
                  latest_date = (
                      ((payload.get("components") or {}).get("relative") or {}).get("latest_date")
                      or payload.get("latest_date")
                      or latest_date
                  )
              except Exception:
                  pass
              print(f"[RESTORE] latest_date={latest_date}")
              raise SystemExit(0)

          payload = {
              "version": "restore-site",
              "generated_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "latest_date": latest_date,
              "restore_site": True,
              "restore_source": os.environ.get("RESTORE_SOURCE", "unknown"),
              "components": {
                  "relative": {
                      "latest_date": latest_date,
                      "source": "committed_data_or_github_pages",
                  }
              },
          }
          merged_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"[RESTORE] latest_date={latest_date}")
          print("[RESTORE] wrote ../shared/merged_signal.json")
          PY

      - name: Run Relative signal regression tests
        if: steps.preflight.outputs.should_run == 'true'
        working-directory: csi300-relative-index
        run: python -m unittest discover -s tests -p "test_relative_*.py"

      - name: Run master orchestrator
        if: steps.preflight.outputs.should_run == 'true'
        timeout-minutes: 20
        env:
          ERP_REPO_PATH: ${{ github.workspace }}/external/equity-risk-premium
          SHARED_DIR: ${{ github.workspace }}/shared

          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          ERP_FEISHU_WEBHOOK_URL: ${{ secrets.ERP_FEISHU_WEBHOOK_URL || secrets.FEISHU_WEBHOOK_URL }}
          ERP_FEISHU_WEBHOOK_SECRET: ${{ secrets.ERP_FEISHU_WEBHOOK_SECRET || secrets.FEISHU_WEBHOOK_SECRET }}
          ERP_FEISHU_APP_TOKEN: ${{ secrets.ERP_FEISHU_APP_TOKEN || secrets.FEISHU_BASE_ID || secrets.FEISHU_APP_TOKEN }}
          ERP_FEISHU_TABLE_ID: ${{ secrets.ERP_FEISHU_TABLE_ID || secrets.FEISHU_TABLE_ID }}

          CSI_FEISHU_WEBHOOK_URL: ${{ secrets.CSI_FEISHU_WEBHOOK_URL }}
          CSI_FEISHU_WEBHOOK_SECRET: ${{ secrets.CSI_FEISHU_WEBHOOK_SECRET }}
          CSI_FEISHU_WEBHOOK_KEYWORD: 指数比价分析
          CSI_FEISHU_APP_TOKEN: ${{ secrets.CSI_FEISHU_APP_TOKEN || secrets.FEISHU_APP_TOKEN }}
          CSI_FEISHU_TABLE_ID: ${{ secrets.CSI_FEISHU_TABLE_ID || secrets.FEISHU_TABLE_ID }}

          DISABLE_BITABLE_SYNC: "true"
          REQUIRE_BITABLE_SYNC: "false"
          FORCE_RELATIVE: ${{ github.event.inputs.force_relative || 'false' }}
          ERP_START_DATE: ${{ github.event.inputs.erp_start_date || '2026-02-14' }}
          ERP_END_DATE: ${{ github.event.inputs.erp_end_date || '' }}
        working-directory: csi300-relative-index
        run: |
          set -euo pipefail

          if [[ -z "${TUSHARE_TOKEN:-}" ]]; then
            echo "::error::TUSHARE_TOKEN is required for ERP data refresh"
            exit 1
          fi

          if [[ -z "${CSI_FEISHU_WEBHOOK_URL:-}" ]]; then
            echo "::warning::CSI_FEISHU_WEBHOOK_URL is empty after secret fallback resolution"
          fi

          CSI_WEBHOOK_TAIL="${CSI_FEISHU_WEBHOOK_URL##*/}"
          CSI_WEBHOOK_TAIL="${CSI_WEBHOOK_TAIL: -8}"
          {
            echo "## Relative webhook target"
            echo ""
            echo "- webhook tail: \`${CSI_WEBHOOK_TAIL:-<missing>}\`"
            echo "- keyword: \`${CSI_FEISHU_WEBHOOK_KEYWORD:-<missing>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          CMD=(python orchestrator/main.py)

          if [[ "$FORCE_RELATIVE" == "true" ]]; then
            CMD+=(--force-relative)
          fi

          if [[ -n "$ERP_START_DATE" ]]; then
            CMD+=(--erp-start-date "$ERP_START_DATE")
          fi

          if [[ -n "$ERP_END_DATE" ]]; then
            CMD+=(--erp-end-date "$ERP_END_DATE")
          fi

          LOG_PATH="$RUNNER_TEMP/master_orchestrator.log"
          "${CMD[@]}" | tee "$LOG_PATH"

          python - << 'PY'
          import json
          import os
          import sys
          from pathlib import Path

          log_path = Path(os.environ["RUNNER_TEMP"]) / "master_orchestrator.log"
          text = log_path.read_text(encoding="utf-8")
          lines = text.splitlines()

          payload = None
          for start in range(len(lines) - 1, -1, -1):
              candidate = "\n".join(lines[start:]).strip()
              if not candidate.startswith("{"):
                  continue
              try:
                  obj = json.loads(candidate)
              except json.JSONDecodeError:
                  continue
              if isinstance(obj, dict):
                  payload = obj
                  break

          if payload is None:
              raise SystemExit("Failed to parse orchestrator JSON result")

          latest_date = payload.get("latest_date")
          relative_run_result = ((payload.get("relative") or {}).get("run_result")) or {}
          feishu_sent = bool(relative_run_result.get("feishu_sent"))
          feishu_result = relative_run_result.get("feishu_result") or {}
          shared_signal_path = (
              relative_run_result.get("shared_signal_path")
              or ((payload.get("relative") or {}).get("shared_signal_path"))
          )
          fallback_error = ""
          webhook_url = os.environ.get("CSI_FEISHU_WEBHOOK_URL", "")
          webhook_keyword = os.environ.get("CSI_FEISHU_WEBHOOK_KEYWORD", "")
          webhook_secret = os.environ.get("CSI_FEISHU_WEBHOOK_SECRET", "")
          webhook_tail = webhook_url[-8:] if webhook_url else ""

          if not feishu_sent:
              try:
                  import pandas as pd

                  repo_root = Path.cwd()
                  data_dir = repo_root / ".claude" / "skills" / "index-compare" / "data"
                  scripts_dir = repo_root / ".claude" / "skills" / "index-compare" / "scripts"
                  processed_path = data_dir / "processed_data.csv"
                  conclusions_path = data_dir / "conclusions.json"

                  if processed_path.exists() and conclusions_path.exists():
                      sys.path.insert(0, str(scripts_dir))
                      from feishu import FeishuWebhook  # type: ignore

                      processed_df = pd.read_csv(processed_path)
                      latest_row = processed_df.iloc[-1].to_dict() if not processed_df.empty else {}
                      conclusions = json.loads(conclusions_path.read_text(encoding="utf-8"))
                      if latest_row:
                          feishu_sent = FeishuWebhook().send(latest_row, conclusions, title="指数比价分析")
                  else:
                      fallback_error = (
                          f"missing fallback inputs: processed={processed_path.exists()} "
                          f"conclusions={conclusions_path.exists()}"
                      )
              except Exception as exc:
                  fallback_error = str(exc)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Orchestrator result\n\n")
              f.write(f"- Latest date: `{latest_date}`\n")
              f.write(f"- Feishu sent: `{feishu_sent}`\n")
              f.write(f"- Feishu result: `{json.dumps(feishu_result, ensure_ascii=False)}`\n")
              f.write(f"- Shared signal path: `{shared_signal_path}`\n")
              f.write(f"- Webhook tail: `{webhook_tail or '<missing>'}`\n")
              f.write(f"- Webhook keyword: `{webhook_keyword or '<missing>'}`\n")
              f.write(f"- Webhook secret present: `{bool(webhook_secret)}`\n")
              if fallback_error:
                  f.write(f"- Feishu fallback note: `{fallback_error}`\n")

          if not feishu_sent:
              warning_message = (
                  "Relative index Feishu webhook was not sent successfully; "
                  f"tail={webhook_tail or '<missing>'}; "
                  f"keyword={webhook_keyword or '<missing>'}; "
                  f"secret_present={bool(webhook_secret)}; "
                  f"result={json.dumps(feishu_result, ensure_ascii=False)}"
              )
              if fallback_error:
                  warning_message += f"; fallback_note={fallback_error}"
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write(f"- Warning: {warning_message}; deployment continues.\n")
              print(f"::warning::{warning_message}; deployment continues")
          PY

      - name: Optional sync ERP data to Feishu table
        id: optional_erp_sync
        if: success() && steps.preflight.outputs.should_run == 'true' && vars.ENABLE_OPTIONAL_ERP_SYNC == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          ERP_FEISHU_APP_TOKEN: ${{ secrets.ERP_FEISHU_APP_TOKEN || secrets.FEISHU_BASE_ID }}
          ERP_FEISHU_TABLE_ID: ${{ secrets.ERP_FEISHU_TABLE_ID }}
          ERP_EXPECTED_FEISHU_APP_TOKEN: O9VFbTbHZafm5psq6ebcGgF7neD
          ERP_EXPECTED_FEISHU_TABLE_ID: tble1VwP4HNtMNm2
        run: |
          python - << 'PY'
          import json, math, os, requests
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          erp_path = Path("shared/erp_signal.json")
          if not erp_path.exists():
              print("No erp_signal.json, skipping")
              exit(0)

          payload = json.loads(erp_path.read_text(encoding="utf-8"))
          records = payload.get("records", [])
          print(f"Records to sync: {len(records)}")
          print(f"ERP source latest_date: {payload.get('latest_date')}")
          if records:
              print(f"ERP last record date: {records[-1].get('date')}")

          app_id = os.environ["FEISHU_APP_ID"]
          app_secret = os.environ["FEISHU_APP_SECRET"]
          app_token = os.environ["ERP_FEISHU_APP_TOKEN"]
          table_id = os.environ["ERP_FEISHU_TABLE_ID"]
          if not app_id or not app_secret or not app_token or not table_id:
              print("::warning::Missing Feishu env; skipping optional ERP Feishu sync")
              exit(0)
          expected_app_token = os.environ.get("ERP_EXPECTED_FEISHU_APP_TOKEN", "")
          expected_table_id = os.environ.get("ERP_EXPECTED_FEISHU_TABLE_ID", "")
          app_token_ok = app_token == expected_app_token
          table_id_ok = table_id == expected_table_id
          print(f"Feishu target is expected KHF base: {app_token_ok}")
          print(f"Feishu target is expected KHF table: {table_id_ok}")
          if expected_app_token and expected_table_id and not (app_token_ok and table_id_ok):
              print("::warning::ERP Feishu target is not the expected KHF Base/Table; skipping optional sync")
              print("::warning::ERP_FEISHU_APP_TOKEN overrides FEISHU_BASE_ID when both secrets exist")
              exit(0)
          print(f"Feishu target table_id: {table_id}")
          records_url = f"https://open.feishu.cn/open-apis/bitable/v1/apps/{app_token}/tables/{table_id}/records"
          r = requests.post(
              "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal",
              json={"app_id": app_id, "app_secret": app_secret}, timeout=15,
          )
          r.raise_for_status()
          token = r.json()["tenant_access_token"]
          h = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          sh_tz = timezone(timedelta(hours=8))

          def to_feishu_date(value):
              try:
                  d = datetime.strptime(str(value)[:10], "%Y-%m-%d").replace(tzinfo=sh_tz)
                  return int(d.timestamp() * 1000)
              except Exception:
                  return value

          def add_number_field(fields, name, value):
              if value is None:
                  return False
              if isinstance(value, (int, float)) and not math.isfinite(value):
                  return False
              fields[name] = value
              return True

          # Build date index so repeated runs update existing rows instead of duplicating them.
          print("Building date index...")
          existing_records = {}
          page_token = None
          while True:
              params = {"page_size": 500}
              if page_token:
                  params["page_token"] = page_token
              r_idx = requests.get(records_url, params=params, headers=h, timeout=30)
              r_idx.raise_for_status()
              data = r_idx.json().get("data", {})
              for item in data.get("items", []):
                  f = item.get("fields", {})
                  dt_val = f.get("日期")
                  record_id = item.get("record_id")
                  if dt_val and record_id:
                      existing_records[dt_val] = record_id
                      existing_records[to_feishu_date(dt_val)] = record_id
              if not data.get("has_more"):
                  break
              page_token = data.get("page_token")
          print(f"Existing dates: {len(existing_records)}")

          original_count = len(records)
          lookback_days = int(os.environ.get("ERP_SYNC_LOOKBACK_DAYS", "120"))
          if existing_records and lookback_days > 0:
              cutoff = datetime.now(sh_tz) - timedelta(days=lookback_days)

              def should_sync(rec):
                  dt = rec.get("date", "")
                  ts = to_feishu_date(dt)
                  if ts not in existing_records:
                      return True
                  try:
                      d = datetime.strptime(str(dt)[:10], "%Y-%m-%d").replace(tzinfo=sh_tz)
                  except Exception:
                      return True
                  return d >= cutoff

              records = [rec for rec in records if should_sync(rec)]
              print(
                  f"Records selected for sync: {len(records)} of {original_count}, "
                  f"lookback_days={lookback_days}"
              )
          else:
              print(f"Records selected for sync: {len(records)} of {original_count}, full sync")

          created = 0
          updated = 0
          failed = 0
          skipped_nonfinite_fields = 0
          for rec in records:
              dt = rec.get("date", "")
              ts = to_feishu_date(dt)

              fields = {
                  "日期": ts,
                  "数据源": "tushare+akshare",
              }
              for field_name, rec_key in (
                  ("沪深300点位", "csi300_close"),
                  ("PE_TTM", "pe_ttm"),
                  ("10年国债收益率", "bond_yield"),
                  ("盈利收益率", "earnings_yield"),
                  ("股权溢价指数", "equity_premium"),
              ):
                  if not add_number_field(fields, field_name, rec.get(rec_key)):
                      skipped_nonfinite_fields += 1
              try:
                  record_id = existing_records.get(ts)
                  if record_id:
                      r2 = requests.put(
                          f"{records_url}/{record_id}",
                          json={"fields": fields}, headers=h, timeout=15,
                      )
                      action = "UPDATE"
                  else:
                      r2 = requests.post(
                          records_url,
                          json={"fields": fields}, headers=h, timeout=15,
                      )
                      action = "CREATE"
                  if r2.status_code == 200 and r2.json().get("code") == 0:
                      if action == "UPDATE":
                          updated += 1
                      else:
                          created += 1
                  else:
                      failed += 1
                      if failed <= 5:
                          try:
                              err = r2.json()
                          except Exception:
                              err = {"text": r2.text[:200]}
                          print(f"  FAIL {action} {dt}: {r2.status_code} {str(err)[:300]}")
              except Exception as exc:
                  failed += 1
                  if failed <= 3:
                      print(f"  FAIL {dt}: {exc}")
              done = created + updated
              if done and done % 100 == 0:
                  print(f"  Progress: {done}/{len(records)}")

          print(f"ERP sync done: {created} created, {updated} updated, {failed} failed, {len(records)} total")
          if skipped_nonfinite_fields:
              print(f"Skipped non-finite numeric fields: {skipped_nonfinite_fields}")
          if failed:
              print(f"::warning::ERP Feishu sync skipped as non-blocking: {failed} failed")
          if records and created + updated == 0:
              print("::warning::ERP Feishu sync wrote zero records; continuing")
          PY

      - name: Generate ERP dashboard artifact
        if: (success() || steps.optional_erp_sync.outcome == 'failure') && steps.preflight.outputs.should_run == 'true'
        run: |
          python external/equity-risk-premium/dashboard/generate_dashboard_data.py

      - name: Upload master artifacts
        if: always() && (steps.preflight.outputs.should_run == 'true' || steps.preflight.outputs.restore_site == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: erp-relative-master-${{ github.run_id }}
          path: |
            shared/*.json
            csi300-relative-index/index_compare_enhanced.xlsx
            csi300-relative-index/reports/index_compare_*.html
            csi300-relative-index/.claude/skills/index-compare/data/*.json
            csi300-relative-index/.claude/skills/index-compare/data/*.csv
            csi300-relative-index/orchestrator/output/*.json
            csi300-relative-index/orchestrator/output/*.md
            external/equity-risk-premium/equity_premium_enhanced.xlsx
            external/equity-risk-premium/dashboard/data/equity_premium.json
            external/equity-risk-premium/dashboard/data/equity_premium.js
            external/equity-risk-premium/dashboard/index.html
          if-no-files-found: warn
          retention-days: 7

      - name: Setup Pages
        if: (success() || steps.optional_erp_sync.outcome == 'failure') && (steps.preflight.outputs.should_run == 'true' || steps.preflight.outputs.restore_site == 'true')
        uses: actions/configure-pages@v5

      - name: Build Pages site
        if: (success() || steps.optional_erp_sync.outcome == 'failure') && (steps.preflight.outputs.should_run == 'true' || steps.preflight.outputs.restore_site == 'true')
        run: |
          python - << 'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          workspace = Path.cwd()
          site_dir = workspace / "site"
          reports_dir = workspace / "csi300-relative-index" / "reports"
          shared_dir = workspace / "shared"
          dashboard_dir = workspace / "external" / "equity-risk-premium" / "dashboard" / "data"

          site_dir.mkdir(parents=True, exist_ok=True)
          (site_dir / ".nojekyll").write_text("", encoding="utf-8")

          prod_reports = sorted(
              p for p in reports_dir.glob("index_compare_*.html")
              if re.match(r"^index_compare_\d{8}_\d{6}\.html$", p.name)
          )
          if not prod_reports:
              raise FileNotFoundError(f"No production report file found in {reports_dir}")

          latest_report = max(prod_reports, key=lambda p: p.stat().st_mtime)
          shutil.copy2(latest_report, site_dir / "index.html")

          data_dir = site_dir / "data"
          data_dir.mkdir(parents=True, exist_ok=True)

          for path in shared_dir.glob("*.json"):
              shutil.copy2(path, data_dir / path.name)

          for name in ("equity_premium.json", "equity_premium.js"):
              source = dashboard_dir / name
              if source.exists():
                  shutil.copy2(source, data_dir / name)

          merged_path = shared_dir / "merged_signal.json"
          summary = {
              "latest_report": latest_report.name,
              "generated_files": sorted([p.name for p in data_dir.glob("*")]),
          }
          if merged_path.exists():
              try:
                  summary["merged_signal"] = json.loads(merged_path.read_text(encoding="utf-8"))
              except Exception:
                  summary["merged_signal"] = {"error": "failed_to_parse"}

          (site_dir / "site_manifest.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"[PAGES] Latest report: {latest_report}")
          print(f"[PAGES] Site dir: {site_dir}")
          PY

      - name: Inspect built site
        if: (success() || steps.optional_erp_sync.outcome == 'failure') && (steps.preflight.outputs.should_run == 'true' || steps.preflight.outputs.restore_site == 'true')
        run: |
          set -euo pipefail

          test -f site/index.html
          test -f site/site_manifest.json

          echo "## Site build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- index.html: \`present\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- site_manifest.json: \`present\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- data dir:" >> "$GITHUB_STEP_SUMMARY"
          find site/data -maxdepth 1 -type f | sort | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[SITE] Manifest:"
          cat site/site_manifest.json

      - name: Deploy to Vercel
        if: (success() || steps.optional_erp_sync.outcome == 'failure') && (steps.preflight.outputs.should_run == 'true' || steps.preflight.outputs.restore_site == 'true')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_CANONICAL_HOST: index-compare-analysis.vercel.app
          VERCEL_CANONICAL_URL: https://index-compare-analysis.vercel.app
        run: |
          set -euo pipefail

          if [[ -z "${VERCEL_TOKEN:-}" || -z "${VERCEL_ORG_ID:-}" || -z "${VERCEL_PROJECT_ID:-}" ]]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are required"
            exit 1
          fi

          npm install --global vercel@50.28.0

          mkdir -p site/.vercel
          cat > site/.vercel/project.json <<EOF
          {
            "orgId": "$VERCEL_ORG_ID",
            "projectId": "$VERCEL_PROJECT_ID"
          }
          EOF

          cd site
          DEPLOY_OUTPUT="$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")"
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1)"
          if [[ -z "$DEPLOY_URL" ]]; then
            echo "::error::Unable to parse Vercel deployment URL from deploy output"
            exit 1
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

          vercel alias set "$DEPLOY_URL" "$VERCEL_CANONICAL_HOST" --token "$VERCEL_TOKEN"

          STATUS_CODE=""
          for attempt in 1 2 3 4 5 6; do
            STATUS_CODE="$(curl -sS -o /tmp/vercel-index.html -w "%{http_code}" "$VERCEL_CANONICAL_URL/")"
            if [[ "$STATUS_CODE" = "200" ]]; then
              break
            fi
            echo "[VERCEL] Canonical URL returned $STATUS_CODE; retry $attempt/6"
            sleep 10
          done
          if [[ "$STATUS_CODE" != "200" ]]; then
            echo "::error::Vercel canonical URL $VERCEL_CANONICAL_URL returned $STATUS_CODE after deploy"
            exit 1
          fi
          if ! grep -q "INDEX COMPARE ANALYSIS REPORT" /tmp/vercel-index.html; then
            echo "::error::Vercel canonical URL returned 200 but did not serve the expected report HTML"
            exit 1
          fi

          curl -fsS "$VERCEL_CANONICAL_URL/data/merged_signal.json" -o /tmp/vercel-merged-signal.json
          echo "## Vercel deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deploy URL: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical URL: $VERCEL_CANONICAL_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical status: $STATUS_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "[VERCEL] Deploy URL: $DEPLOY_URL"
          echo "[VERCEL] Canonical URL: $VERCEL_CANONICAL_URL"

      - name: Upload Pages artifact
        if: (success() || steps.optional_erp_sync.outcome == 'failure') && (steps.preflight.outputs.should_run == 'true' || steps.preflight.outputs.restore_site == 'true')
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Optional archive ERP signal to Feishu table
        if: always() && steps.preflight.outputs.should_run == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          ERP_ARCHIVE_FEISHU_APP_TOKEN: O9VFbTbHZafm5psq6ebcGgF7neD
          ERP_ARCHIVE_FEISHU_TABLE_ID: tble1VwP4HNtMNm2
          ERP_ARCHIVE_SIGNAL_PATH: shared/erp_signal.json
          ERP_ARCHIVE_START_DATE: "2026-07-01"
          ERP_ARCHIVE_LOOKBACK_DAYS: "120"
          ERP_ARCHIVE_UPDATE_EXISTING: "false"
          ERP_ARCHIVE_REQUIRE_SUCCESS: "false"
        run: python csi300-relative-index/orchestrator/sync_erp_signal_to_feishu.py

  deploy-pages:
    if: success() && needs.run-master-orchestrator.result == 'success' && (needs.run-master-orchestrator.outputs.should_run == 'true' || needs.run-master-orchestrator.outputs.restore_site == 'true')
    needs: run-master-orchestrator
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
